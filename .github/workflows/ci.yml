name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1" # weekly run, catches drift in dependencies and scanners

env:
  VULN_SHOP_REPO: ${{ github.repository_owner }}/vuln-shop

jobs:
  e2e:
    name: UI, API, a11y and security tests (secure mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/start-vuln-shop
        with:
          repository: ${{ env.VULN_SHOP_REPO }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Run all tests against secure mode
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8001
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/junit.xml

  security-proof:
    name: Prove the security suite catches real bugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/start-vuln-shop
        with:
          repository: ${{ env.VULN_SHOP_REPO }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Every @security test must FAIL against vulnerable mode
        env:
          BASE_URL: http://localhost:8000
        run: |
          npx playwright test --grep @security --retries=0 --reporter=json > results.json || true
          node -e '
            const r = require("./results.json");
            const s = r.stats;
            console.log(`expected failures: ${s.unexpected}, unexpected passes: ${s.expected}`);
            if (s.expected > 0 || s.unexpected === 0) {
              console.error("A security test passed against the vulnerable app - it is not detecting its bug.");
              process.exit(1);
            }'

  perf:
    name: k6 performance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/start-vuln-shop
        with:
          repository: ${{ env.VULN_SHOP_REPO }}
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
      - run: mkdir -p reports && k6 run perf/smoke.js
        env:
          BASE_URL: http://localhost:8001
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: k6-summary
          path: reports/k6-summary.json

  scans:
    name: ZAP and Trivy scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/start-vuln-shop
        with:
          repository: ${{ env.VULN_SHOP_REPO }}
      - name: OWASP ZAP baseline (passive scan of both modes)
        run: |
          mkdir -p reports && chmod 777 reports
          for target in vulnerable:8000 secure:8001; do
            name=${target%%:*}; port=${target##*:}
            docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py -t "http://localhost:$port" -r "zap-$name.html" -J "zap-$name.json" -I
          done
      - name: Trivy dependency, secret and config scan (of vuln-shop)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: vuln-shop
          scanners: vuln,secret,misconfig
          format: json
          output: reports/trivy.json
          exit-code: "0" # report-only; triage below decides what matters
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Triage all scan results (scan-triage-bot)
        run: |
          pip install --quiet "git+https://github.com/${{ github.repository_owner }}/scan-triage-bot"
          scan-triage reports/zap-vulnerable.json reports/zap-secure.json reports/trivy.json \
            -o reports/scan-triage.md --json-output reports/scan-triage.json
          cat reports/scan-triage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: scan-reports
          path: reports/

  publish:
    name: Publish reports to GitHub Pages
    if: always() && github.ref == 'refs/heads/main'
    needs: [e2e, perf, scans]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Build report site
        run: |
          mkdir -p site
          cp -r artifacts/playwright-report/playwright-report site/playwright 2>/dev/null || true
          cp artifacts/scan-reports/*.html artifacts/scan-reports/*.json artifacts/scan-reports/*.md site/ 2>/dev/null || true
          cp artifacts/k6-summary/k6-summary.json site/ 2>/dev/null || true
          cat > site/index.html <<HTML
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>QA reports</title>
          <style>body{font-family:system-ui;max-width:640px;margin:3rem auto}li{margin:.5rem 0}</style></head>
          <body><h1>QA reports</h1><p>Run ${GITHUB_RUN_NUMBER} &middot; ${GITHUB_SHA::7}</p><ul>
          <li><a href="playwright/index.html">Playwright: UI, API, accessibility, security</a></li>
          <li><a href="zap-vulnerable.html">OWASP ZAP: vulnerable mode</a></li>
          <li><a href="zap-secure.html">OWASP ZAP: secure mode</a></li>
          <li><a href="scan-triage.md">Ranked security triage (scan-triage-bot)</a></li>
          <li><a href="trivy.json">Trivy scan (raw)</a></li>
          <li><a href="k6-summary.json">k6 performance summary</a></li>
          </ul></body></html>
          HTML
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
